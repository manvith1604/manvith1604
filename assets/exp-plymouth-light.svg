<svg xmlns="http://www.w3.org/2000/svg" width="900" height="186" viewBox="0 0 900 186" role="img" aria-label="Plymouth Rock Assurance. Data Engineer Co-op, Boston, MA, Jul 2024 – Jan 2025. Migrated SAS pipelines to Python and Polars, Parquet on S3, run on Fargate and Step Functions. −77% pipeline runtime. 300M+ rows of vendor data. −80% cloud compute cost">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f1f5fb"/></linearGradient>
    <style>
      .co { font: 700 22px -apple-system, "Segoe UI", Inter, sans-serif; fill: #0f1b2d; letter-spacing: -.4px }
      .ro { font: 500 14px -apple-system, "Segoe UI", Inter, sans-serif; fill: #0f1b2d }
      .mu { font: 400 12.5px -apple-system, "Segoe UI", Inter, sans-serif; fill: #4a5a72 }
      .op { font: 700 10px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .2px }
      .id { font: 400 10.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #8a98ad }
      .dt { font: 600 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #017cee }
      .mv { font: 700 17px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #017cee }
      .ml { font: 400 11px -apple-system, "Segoe UI", Inter, sans-serif; fill: #4a5a72 }
      .pulse { animation: pulse 1.8s ease-in-out infinite }
      @keyframes pulse { 50% { opacity: .3 } }
      @media (prefers-reduced-motion: reduce) { .pulse { animation: none } }
    </style>
  </defs>
  <rect width="900" height="186" rx="14" fill="url(#bg)"/>
  <rect x=".5" y=".5" width="899" height="185" rx="14" fill="none" stroke="#d9e1ec"/>
  <rect x="0" y="0" width="6" height="186" rx="3" fill="#d97706"/>
  <rect x="28" y="22" width="90" height="18" rx="4" fill="#d97706" opacity=".16"/>
  <text x="35" y="35" class="op" fill="#d97706">CoopOperator</text>
  <text x="128" y="35" class="id">task_id: plymouth_coop</text>
  <circle cx="780" cy="31" r="4.5" fill="#16a34a"/>
  <text x="790" y="35" class="op" fill="#16a34a">success</text>
  <text x="28" y="72" class="co">Plymouth Rock Assurance</text>
  <text x="872" y="70" class="dt" text-anchor="end">Jul 2024 – Jan 2025</text>
  <text x="28" y="94" class="ro">Data Engineer Co-op</text>
  <text x="872" y="94" class="mu" text-anchor="end">Boston, MA</text>
  <text x="28" y="117" class="mu">Migrated SAS pipelines to Python and Polars, Parquet on S3, run on Fargate and Step Functions.</text>
  <rect x="28" y="132" width="272" height="40" rx="8" fill="#eef3fa" stroke="#d9e1ec"/>
  <text x="40" y="158" class="mv">−77%</text>
  <text x="84" y="157" class="ml">pipeline runtime</text>
  <rect x="314" y="132" width="272" height="40" rx="8" fill="#eef3fa" stroke="#d9e1ec"/>
  <text x="326" y="158" class="mv">300M+</text>
  <text x="381" y="157" class="ml">rows of vendor data</text>
  <rect x="600" y="132" width="272" height="40" rx="8" fill="#eef3fa" stroke="#d9e1ec"/>
  <text x="612" y="158" class="mv">−80%</text>
  <text x="656" y="157" class="ml">cloud compute cost</text>
</svg>
