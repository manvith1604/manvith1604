<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Manvith Belame Yogesh. Data Engineer at Walnutech AI. M.S. Data Analytics Engineering, Northeastern · GPA 3.9 · 5+ years in data. Open to data engineering roles, Phoenix AZ, open to relocation. 76%→&lt;1% extraction failures. 2.3h→10m monthly crawl. −77% pipeline runtime. 300M+ rows processed. −80% cloud compute. 50+ data-quality rules.">
