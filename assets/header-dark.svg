    <style>
      .n { font: 700 40px -apple-system, "Segoe UI", Inter, sans-serif; letter-spacing: -1.4px; fill: #e6edf7 }
      .r { font: 500 18px -apple-system, "Segoe UI", Inter, sans-serif; fill: #e6edf7 }
      .s { font: 400 13.5px -apple-system, "Segoe UI", Inter, sans-serif; fill: #94a3bd }
      .k { font: 700 18px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #3d9bff }
      .l { font: 400 11px -apple-system, "Segoe UI", Inter, sans-serif; fill: #94a3bd }
      .e { font: 600 10.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #00c7d4; letter-spacing: 1.6px }
      .t { font: 600 8px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #94a3bd }
      .dag { font: 500 9px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #5d6c88 }
      .edge { fill: none; stroke: #3d9bff; stroke-width: 1.4; stroke-dasharray: 4 4; opacity: .85;
               animation: flow .8s linear infinite }
      .task { fill: #111b30; stroke: #475569; stroke-width: 2; animation: state 9.0s linear infinite both }
      .pulse { animation: pulse 2s ease-out infinite; transform-origin: 48px 46px }
      @keyframes flow { to { stroke-dashoffset: -8 } }
      @keyframes state {
        0% { stroke: #a3e635 }
        5.00% { stroke: #a3e635 }
        5.01% { stroke: #22c55e }
        90.00% { stroke: #22c55e }
        90.01% { stroke: #475569 }
        100% { stroke: #475569 }
      }
      @keyframes pulse { 0% { opacity: .9; transform: scale(1) } 100% { opacity: 0; transform: scale(3) } }
      @media (prefers-reduced-motion: reduce) { .edge, .task, .pulse { animation: none } .task { stroke: #22c55e } }
    </style>
  </defs>
